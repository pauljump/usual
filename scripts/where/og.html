<!doctype html><html><head><meta charset="utf-8"><style>
:root{--paper:#f5f2e9;--ink:#262820;--muted:#6b6e61;--orange:#cc482b}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.left{position:absolute;left:64px;top:70px;width:440px}
.eyebrow{font:15px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:400 92px/0.98 Georgia,serif;letter-spacing:-.03em;margin:22px 0 26px}h1 span{color:var(--orange)}
p{font-size:25px;line-height:1.35;margin:0;color:#3b3e33}
.cmd{position:absolute;left:64px;bottom:62px;font:20px ui-monospace,Menlo,monospace;background:var(--ink);color:var(--paper);padding:14px 18px;border-radius:6px}
.cmd b{color:#f09a7e;font-weight:400}
.shot{position:absolute;left:560px;top:58px;width:900px;border:2px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;background:#fff}
.shot img{display:block;width:900px}
</style></head><body>
<div class="left"><div class="eyebrow">usual / where</div><h1>Where<br>was I<span>?</span></h1>
<p>Every Claude Code and Codex session on one board. What's waiting on you. Click to resume.</p></div>
<div class="cmd"><b>$</b> python3 where.py board</div>
<div class="shot"><img src="board.png"></div>
</body></html>
