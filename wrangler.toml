name = "thought-swarm"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "thoughtswarm.tryusual.com", custom_domain = true }]

[vars]
PUBLIC_BASE_URL = "https://thoughtswarm.tryusual.com"
# SWARM_MODEL = "claude-haiku-5-5"
# MISSES_PER_HOUR = "60"

# Secrets (wrangler secret put …): ANTHROPIC_API_KEY, SWARM_AGENT_SALT,
# A2A_BEARER_TOKEN, ARELAY_VERIFICATION_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "thought-swarm"
database_id = "f44bb949-9ec7-4f42-964e-a1bcdc8d0860"
