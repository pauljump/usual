<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Opening…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#0b0b0c;color:#f4f4f5}
  a{color:inherit}
  .fallback{max-width:340px;padding:24px;text-align:center;font-size:14px;line-height:1.5;opacity:.8}
</style>
</head>
<body>
  <!-- Shown only if JS is off or the target is missing/invalid. -->
  <div class="fallback">
    <p id="msg">Redirecting you to your browser…</p>
    <p><a id="raw" href="#">Continue</a></p>
  </div>

  <script>
  /* ----------------------------------------------------------------------
   * Deploy this folder to any static host (Cloudflare Pages, GitHub Pages,
   * Netlify, Vercel...). Then share links like:
   *
   *     https://go.yoursite.com/?u=https://yoursite.com/post
   *
   * Optional params:
   *     &name=Your%20Site           label shown in the card
   *     &app_ios=https://...        deep link / universal link (iOS)
   *     &app_android=https://...    deep link / universal link (Android)
   * -------------------------------------------------------------------- */

  // OPEN-REDIRECT GUARD -- REQUIRED. List every hostname you link to; subdomains
  // are NOT implied, list them individually. An empty list forwards nothing,
  // because a wide-open ?u= endpoint is an open redirect that phishing will find.
  var ALLOW_HOSTS = [
    // 'example.com',
    // 'www.example.com',
  ];

  var q = new URLSearchParams(location.search);
  var target = q.get('u') || q.get('url') || '';

  function valid(u) {
    if (!ALLOW_HOSTS.length) return false;
    try {
      var p = new URL(u);
      if (p.protocol !== 'http:' && p.protocol !== 'https:') return false;
      return ALLOW_HOSTS.indexOf(p.hostname) !== -1;
    } catch (e) { return false; }
  }

  // Deep links may use custom schemes, so they can't go through `valid()`.
  // Reject only the script-bearing schemes.
  function safeDeepLink(u) {
    if (!u) return null;
    return /^(?:javascript|data|vbscript|file|blob):/i
      .test(u.replace(/[\u0000-\u0020]/g, '')) ? null : u;
  }

  if (!valid(target)) {
    document.getElementById('msg').textContent = ALLOW_HOSTS.length
      ? 'This link has no valid ?u= destination.'
      : 'Not configured: add your hostnames to ALLOW_HOSTS in index.html.';
    document.getElementById('raw').style.display = 'none';
  } else {
    document.getElementById('raw').href = target;
    // Load the widget from the same deploy.
    var s = document.createElement('script');
    // Copy src/escape-webview.js next to this file when you deploy.
    s.src = 'escape-webview.js';
    s.setAttribute('data-manual', '');
    s.onload = function () {
      if (window.EscapeWebview && window.EscapeWebview.isInApp()) {
        window.EscapeWebview.init({
          url: target,
          name: q.get('name'),
          app: (q.get('app_ios') || q.get('app_android'))
            ? { ios: safeDeepLink(q.get('app_ios')),
                android: safeDeepLink(q.get('app_android')) } : null
        });
      } else {
        location.replace(target);       // normal browser: just go
      }
    };
    s.onerror = function () { location.replace(target); };
    document.head.appendChild(s);
  }
  </script>
</body>
</html>
