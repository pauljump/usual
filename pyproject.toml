[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "usual"
version = "2.1.0b1"
description = "Your AI, how you like it: independent local tools, evidence, routines and shareable setups."
requires-python = ">=3.11"
# NO runtime deps — stdlib only (spec §2)
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests", "demo/reading-list"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usual = ["*.html", "catalog.json", "public/*", "recall_core/LICENSE", "vendor/escape_webview/*"]

[project.scripts]
usual = "usual.cli:main"
usual-server = "usual.server:main"
usual-build-exam = "usual.build_exam:_main"
usual-grade = "usual.grade:_main"
usual-redact = "usual.redact:_main"
